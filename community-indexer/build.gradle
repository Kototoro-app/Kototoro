// Community indexer (docs/architecture/community-nostr-plan-2026-11.md §6): archives Kototoro's Nostr events and
// publishes the static snapshot the app reads. Runs in GitHub Actions; never shipped in an app.
plugins {
	id 'org.jetbrains.kotlin.jvm'
	id 'org.jetbrains.kotlin.plugin.serialization'
	id 'application'
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
	// The same work keys, grouping and snapshot model the app uses.
	implementation project(':core-domain')
	implementation project(':core-net')
	implementation libs.ktor.client.java
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${libs.versions.coroutines.get()}"
	implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${libs.versions.serialization.get()}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
}

application {
	mainClass = 'org.skepsun.kototoro.community.indexer.CommunityIndexerCliKt'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}
