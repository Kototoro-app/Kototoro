// Kotlin Multiplatform module (docs/architecture/kmp-ios-plan-2026-10.md, phase P1).
//
// Two parallel API families live here:
//  - org.skepsun.kototoro.parsers.*  the app's own model and parser API. The pure parts move to commonMain
//    (iOS consumes them); the parts that need Android, OkHttp or Jsoup stay in androidMain.
//  - org.koitharu.kotatsu.parsers.*  the binary ABI that external Kotatsu parser jars are compiled against.
//    It must keep its exact class and method shapes, so it stays untouched in androidMain.
plugins {
	id 'org.jetbrains.kotlin.multiplatform'
	id 'com.android.kotlin.multiplatform.library'
}

kotlin {
	androidLibrary {
		namespace = 'org.skepsun.kototoro.parsers.api'
		compileSdk = 37
		minSdk = 26
		enableCoreLibraryDesugaring = true

		compilerOptions {
			jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
			// Java-annotation nullability only exists on the JVM.
			freeCompilerArgs.add('-Xjspecify-annotations=strict')
		}
	}

	// JVM target: lets shared modules (e.g. :core-db) run their tests on a plain JVM, and lets the Windows parser
	// host load kototoro / kotatsu / Tsuki plugin jars against the very same ABI classes as Android (androidMain is
	// plain JVM code apart from androidx.annotation / androidx.collection; see the jvmMain source set below).
	jvm {
		compilerOptions {
			jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
			freeCompilerArgs.add('-Xjspecify-annotations=strict')
		}
	}

	// Apple targets are declared on every host but only link on macOS; compileCommonMainKotlinMetadata is
	// the portability check that runs everywhere.
	iosArm64()
	iosSimulatorArm64()

	compilerOptions {
		freeCompilerArgs.addAll(
			'-opt-in=kotlin.ExperimentalStdlibApi',
			'-opt-in=org.skepsun.kototoro.parsers.InternalParsersApi',
			'-opt-in=org.koitharu.kotatsu.parsers.InternalParsersApi',
			'-opt-in=kotlin.contracts.ExperimentalContracts',
			'-Xannotation-default-target=first-only',
		)
	}

	sourceSets {
		getByName('commonMain') {
			dependencies {
				// KMP artifact of androidx.collection (the -ktx one used by androidMain is Android-only).
				api "androidx.collection:collection:${libs.versions.collections.get()}"
			}
		}
		getByName('androidMain') {
			dependencies {
				implementation libs.kotlinx.coroutines.android
				implementation "androidx.annotation:annotation:1.9.1"
				api libs.androidx.collection

				// Exposed to :app, which relies on them transitively.
				api "org.jsoup:jsoup:1.17.2"
				api libs.okhttp
				api libs.okio
				api libs.rhino
			}
		}
		getByName('jvmMain') {
			// One copy of the parser ABI: the JVM target compiles the same files. External plugin jars are bound
			// to these exact class and method shapes, so there is deliberately no second hand-written variant.
			kotlin.srcDir('src/androidMain/kotlin')
			dependencies {
				implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${libs.versions.coroutines.get()}"
				implementation "androidx.annotation:annotation:1.9.1"
				api "org.jsoup:jsoup:1.17.2"
				api libs.okhttp
				api libs.okio
				api libs.rhino
				// Android ships org.json in the framework; a plain JVM needs the standalone artifact.
				api libs.json
			}
		}
	}
}

dependencies {
	coreLibraryDesugaring libs.desugar.jdk.libs
}
