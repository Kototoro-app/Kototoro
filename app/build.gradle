import java.time.LocalDateTime
import java.util.Locale
import java.util.zip.ZipFile

plugins {
	id 'com.android.application'
	id 'com.google.devtools.ksp'
	id 'kotlin-parcelize'
	id 'com.google.dagger.hilt.android'
	id 'androidx.room'
	id 'org.jetbrains.kotlin.plugin.serialization'
	id 'org.jetbrains.kotlin.plugin.compose'
	// enable if needed
	// id 'dev.reformator.stacktracedecoroutinator'
}

room {
	schemaDirectory("$projectDir/schemas")
}

def allAbiFilters = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase(Locale.ROOT) }
def debugOnlyAbiBuild = !requestedTaskNames.isEmpty() &&
	requestedTaskNames.any { it.contains('debug') } &&
	requestedTaskNames.every { !it.contains('release') && !it.contains('nightly') }
def activeAbiFilters = debugOnlyAbiBuild ? ['arm64-v8a'] : allAbiFilters

android {
	// Phase B: Compose 1.12 requires compileSdk 37; targetSdk stays 36
	// (Android 17 orientation-lock behavior rework is tracked in Phase E).
	compileSdk = 37
	namespace = 'org.skepsun.kototoro'

	signingConfigs {
		release {
			// Only configure signing if properties are provided
			if (project.hasProperty('RELEASE_STORE_FILE')) {
				storeFile file(RELEASE_STORE_FILE)
				storePassword RELEASE_STORE_PASSWORD
				keyAlias RELEASE_KEY_ALIAS
				keyPassword RELEASE_KEY_PASSWORD
			}
		}
	}

	defaultConfig {
		applicationId 'org.skepsun.kototoro'
		minSdk = 26
		// Phase E: targetSdk 37. Large-screen orientation locks are skipped in
		// ScreenOrientationHelper to match Android 17 behavior.
		targetSdk = 37
		versionCode = 1209
		versionName = '1.9.6'
		manifestPlaceholders = [
			appClassName: 'org.skepsun.kototoro.KototoroApp'
		]
		generatedDensities = []
		testInstrumentationRunner 'org.skepsun.kototoro.HiltTestRunner'
		ksp {
			arg('room.generateKotlin', 'true')
		}
		androidResources {
			// https://issuetracker.google.com/issues/408030127
			generateLocaleConfig false
		}
		def localProperties = new Properties()
		def localPropertiesFile = rootProject.file('local.properties')
		if (localPropertiesFile.exists()) {
			localProperties.load(new FileInputStream(localPropertiesFile))
		}
		resValue 'string', 'tg_backup_bot_token', localProperties.getProperty('tg_backup_bot_token', '')
		def dandanAppId = (project.findProperty('dandanplay.appId')
			?: localProperties.getProperty('dandanplay.appId')
			?: 'demo_app_id').toString()
		def dandanAppSecret = (project.findProperty('dandanplay.appSecret')
			?: localProperties.getProperty('dandanplay.appSecret')
			?: 'demo_app_secret').toString()
		buildConfigField 'String', 'DANDANPLAY_APP_ID', "\"${dandanAppId}\""
		buildConfigField 'String', 'DANDANPLAY_APP_SECRET', "\"${dandanAppSecret}\""
		externalNativeBuild {
			cmake {
				cppFlags ""
				abiFilters(*activeAbiFilters)
			}
		}
	}
	externalNativeBuild {
		cmake {
			path "src/main/cpp/CMakeLists.txt"
			version "3.22.1"
		}
	}
	buildTypes {
		debug {
			applicationIdSuffix = '.debug'
		}
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			// Only apply signing config if it's properly configured
			if (project.hasProperty('RELEASE_STORE_FILE')) {
				signingConfig signingConfigs.release
			}
		}
		nightly {
			initWith release
			applicationIdSuffix = '.nightly'
			matchingFallbacks = ['release', 'debug']
		}
	}
	splits {
		abi {
			enable true
			reset()
			include(*activeAbiFilters)
			universalApk !debugOnlyAbiBuild
		}
	}
	buildFeatures {
		viewBinding true
		buildConfig true
		compose true
		// AGP 9: resValues defaults to false; tg_backup_bot_token is injected via resValue.
		resValues true
	}
	packaging {
		jniLibs {
			useLegacyPackaging = true
			pickFirsts += [
				'lib/arm64-v8a/libquickjs.so',
				'lib/armeabi-v7a/libquickjs.so',
				'lib/x86/libquickjs.so',
				'lib/x86_64/libquickjs.so',
				'**/libc++_shared.so'
			]
		}
		resources {
			excludes += [
				'META-INF/README.md',
				'META-INF/NOTICE.md',
				'META-INF/LICENSE.md',
				'META-INF/LICENSE-notice.md',
				'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
				'META-INF/AL2.0',
				'META-INF/LGPL2.1',
				// djl/tokenizers ships desktop binaries that are useless for Android APK.
				'native/lib/osx-aarch64/**',
				'native/lib/win-x86_64/**',
				'native/lib/linux-x86_64/**'
			]
		}
	}
	sourceSets {
		androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
		main.java.srcDirs += 'src/main/kotlin/'
		test.java.srcDirs += 'src/test/kotlin/'
		androidTest.java.srcDirs += 'src/androidTest/kotlin/'
	}
	compileOptions {
		coreLibraryDesugaringEnabled true
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
	kotlin {
		compilerOptions {
			jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
			freeCompilerArgs.addAll(
				'-opt-in=kotlin.ExperimentalStdlibApi',
				'-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
				'-opt-in=kotlinx.coroutines.ExperimentalForInheritanceCoroutinesApi',
				'-opt-in=kotlinx.coroutines.InternalForInheritanceCoroutinesApi',
				'-opt-in=kotlinx.coroutines.FlowPreview',
				'-opt-in=kotlin.contracts.ExperimentalContracts',
				'-opt-in=coil3.annotation.ExperimentalCoilApi',
				'-opt-in=coil3.annotation.InternalCoilApi',
				'-opt-in=kotlinx.serialization.ExperimentalSerializationApi',
				'-opt-in=org.skepsun.kototoro.parsers.InternalParsersApi',
				'-Xjspecify-annotations=strict',
				'-Xannotation-default-target=first-only',
				'-Xtype-enhancement-improvements-strict-mode',
			)
		}
	}
	lint {
		abortOnError true
		checkReleaseBuilds false
		disable 'MissingTranslation', 'PrivateResource', 'SetJavaScriptEnabled', 'SimpleDateFormat'
	}
	testOptions {
		unitTests.includeAndroidResources true
		unitTests.returnDefaultValues true
		unitTests.all {
			useJUnitPlatform()
		}
		execution 'ANDROIDX_TEST_ORCHESTRATOR'
		animationsDisabled = true
	}
	// AGP 9 removed the legacy applicationVariants API; nightly version overrides use the
	// Variant API instead (AGENTS.md: nightly versionCode/versionName are date-generated).
	androidComponents {
		onVariants(selector().withName('nightly'), { variant ->
			def now = LocalDateTime.now()
			variant.outputs.each { output ->
				output.versionCode.set(now.format("yyMMdd").toInteger())
				output.versionName.set('N' + now.format("yyyyMMdd"))
			}
		})
	}
}


hilt {
