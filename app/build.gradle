		main.java.srcDirs += 'src/main/kotlin/'
		benchmark.kotlin.srcDirs += 'src/release/kotlin/'
		benchmark.res.srcDirs += 'src/release/res/'
		test.java.srcDirs += 'src/test/kotlin/'
		androidTest.java.srcDirs += 'src/androidTest/kotlin/'
	}
	compileOptions {
		coreLibraryDesugaringEnabled true
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
	kotlin {
		compilerOptions {
			jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
			// all: emit concrete interface default methods AND javac-style `-CC` bridge
			// classes (e.g. NovelSource$-CC.$default$isNovelSource) that NovelSourcery /
			// Tsundoku extensions reference; modern Mihon extensions compile against
			// jvm-default=all source-api so they rely on the inline interface defaults.
			freeCompilerArgs.addAll(
				'-Xjvm-default=all',
				'-opt-in=kotlin.ExperimentalStdlibApi',
				'-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
				'-opt-in=kotlinx.coroutines.ExperimentalForInheritanceCoroutinesApi',
				'-opt-in=kotlinx.coroutines.InternalForInheritanceCoroutinesApi',
				'-opt-in=kotlinx.coroutines.FlowPreview',
				'-opt-in=kotlin.contracts.ExperimentalContracts',
				'-opt-in=coil3.annotation.ExperimentalCoilApi',
				'-opt-in=coil3.annotation.InternalCoilApi',
				'-opt-in=kotlinx.serialization.ExperimentalSerializationApi',
				'-opt-in=org.skepsun.kototoro.parsers.InternalParsersApi',
				'-Xjspecify-annotations=strict',
				'-Xannotation-default-target=first-only',
			)
		}
	}
	lint {
		abortOnError true
		checkReleaseBuilds false
		disable 'MissingTranslation', 'PrivateResource', 'SetJavaScriptEnabled', 'SimpleDateFormat'
	}
	testOptions {
		unitTests.includeAndroidResources true
		unitTests.returnDefaultValues true
		unitTests.all {
			useJUnitPlatform()
		}
		animationsDisabled = true
	}
	// AGP 9 removed the legacy applicationVariants API; nightly version overrides use the
	// Variant API instead (AGENTS.md: nightly versionCode/versionName are date-generated).
	androidComponents {
		onVariants(selector().all(), { variant ->
			def capName = variant.name.capitalize()
			def genUiStrings = tasks.register("generate${capName}UiStringIds", GenerateAndroidUiStringIdsTask) {
				uiSources.from(
					fileTree(rootProject.file('core-ui/src/commonMain/kotlin')) { include '**/*.kt' },
					fileTree('src/main/kotlin') { include '**/*.kt' },
				)
				resourceCatalogs.from(
					fileTree('src/main/res/values') { include '*.xml' },
				)
				contentTypesFile.set(
					rootProject.file('parser-api/src/commonMain/kotlin/org/skepsun/kototoro/parsers/model/ContentType.kt'),
				)
			}
			variant.sources.kotlin.addGeneratedSourceDirectory(genUiStrings) { it.outputDir }
		})
		onVariants(selector().withName('nightly'), { variant ->
			def now = LocalDateTime.now()
			variant.outputs.each { output ->
				output.versionCode.set(now.format("yyMMdd").toInteger())
				output.versionName.set('N' + now.format("yyyyMMdd"))
			}
		})
	}
}


