def tsukiRuntimeSource = configurations.create('tsukiRuntimeSource') {
	canBeConsumed = false
	canBeResolved = true
	transitive = false
}
def tsukiSourceJar = tsukiRuntimeSource.elements.map { artifacts ->
	if (artifacts.size() != 1) {
		throw new GradleException("Expected one Tsuki runtime artifact, found ${artifacts.size()}")
	}
	artifacts.first().asFile
}
def tsukiSanitizedJarTask = tasks.register('prepareTsukiRuntimeJar', Jar) {
	archiveBaseName.set('tsuki-runtime')
	destinationDirectory.set(layout.buildDirectory.dir('generated/tsuki'))
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	preserveFileTimestamps = false
	reproducibleFileOrder = true

	from(zipTree(tsukiSourceJar)) {
		// parser-api owns this shared ABI. Tsuki 1.0.5 accidentally bundles another copy.
		exclude 'org/koitharu/kotatsu/core/parser/CSSBackground*.class'
	}

	doLast {
		def outputJar = archiveFile.get().asFile
		ZipFile zipFile = new ZipFile(outputJar)
		try {
			def duplicateClass = zipFile.entries().find { entry ->
				entry.name.startsWith('org/koitharu/kotatsu/core/parser/CSSBackground') &&
					entry.name.endsWith('.class')
			}
			if (duplicateClass != null) {
				throw new GradleException("Sanitized Tsuki jar still contains ${duplicateClass.name}")
			}
			if (zipFile.getEntry('tsuki/MangaParser.class') == null) {
				throw new GradleException('Sanitized Tsuki jar is missing tsuki/MangaParser.class')
			}
		} finally {
			zipFile.close()
		}
	}
}
def tsukiRuntimeJar = files(tsukiSanitizedJarTask.flatMap { it.archiveFile })

def cloudstreamSourceJar = layout.projectDirectory.file('libs/cloudstream3-library-jvm-1.0.1.jar')
// Official library:jvmJar built from recloudstream/cloudstream commit caf0db3dc13bd75a496d4a94152bb8f22f8fdb1e.
def cloudstreamSourceSha256 = '0a281a34bc4335f024b9bf0ac55ba341d7ae99f5b8918c692c669d7d0bed600e'
def cloudstreamSanitizedJarTask = tasks.register('prepareCloudstreamRuntimeJar', Jar) {
	archiveBaseName.set('cloudstream3-runtime')
	archiveVersion.set('pre-release')
	destinationDirectory.set(layout.buildDirectory.dir('generated/cloudstream'))
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	preserveFileTimestamps = false
	reproducibleFileOrder = true

	from({
		def sourceJar = cloudstreamSourceJar.asFile
		if (!sourceJar.exists()) {
			throw new GradleException("Missing Cloudstream source jar: ${sourceJar.absolutePath}")
		}
		zipTree(sourceJar)
	}) {
		// library:jvmJar contains a no-op JVM resolver. Kototoro supplies the Android implementation.
		exclude 'com/lagradost/cloudstream3/network/WebViewResolver*.class'
		// The JVM context helper always returns null. Kototoro supplies the Android implementation.
		exclude 'com/lagradost/api/ContextHelper_jvmKt.class'
	}

	doLast {
		[
			(cloudstreamSourceJar.asFile): cloudstreamSourceSha256,
		].each { inputJar, expectedSha256 ->
			def digest = java.security.MessageDigest.getInstance('SHA-256')
			inputJar.withInputStream { input ->
				byte[] buffer = new byte[8192]
				for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
					digest.update(buffer, 0, read)
				}
			}
			def actualSha256 = digest.digest().encodeHex().toString()
			if (actualSha256 != expectedSha256) {
				throw new GradleException(
					"Unexpected Cloudstream jar SHA-256 for ${inputJar.name}: ${actualSha256}; expected ${expectedSha256}",
				)
			}
		}

		def outputJar = archiveFile.get().asFile
		def forbiddenEntries = []
		ZipFile zipFile = new ZipFile(outputJar)
		try {
			zipFile.entries().each { entry ->
				if (
					entry.name.startsWith('coil3/') ||
					entry.name.startsWith('androidx/') ||
					entry.name.startsWith('kotlinx/coroutines/') ||
					entry.name.startsWith('com/google/android/material/') ||
					(
						(entry.name ==~ /.*\/R(\$[^\/]+)?\.class$/ || entry.name.endsWith('/BuildConfig.class')) &&
						!entry.name.startsWith('com/lagradost/cloudstream3/') &&
						!entry.name.startsWith('com/lagradost/api/')
					)
				) {
					forbiddenEntries << entry.name
				}
			}
		} finally {
			zipFile.close()
		}
		if (!forbiddenEntries.isEmpty()) {
			throw new GradleException("Sanitized Cloudstream jar still contains forbidden entries: ${forbiddenEntries.take(5)}")
		}
		ZipFile verifiedZipFile = new ZipFile(outputJar)
		try {
			[
				'com/lagradost/cloudstream3/plugins/BasePlugin.class',
				'com/lagradost/cloudstream3/utils/ExtractorApi.class',
				'com/lagradost/cloudstream3/utils/JsInterpreterKt.class',
				// The official NewPipe-backed extractor; the host bundles NewPipeExtractor for it (#608).
				'com/lagradost/cloudstream3/extractors/YoutubeExtractor.class',
			].each { requiredEntry ->
				if (verifiedZipFile.getEntry(requiredEntry) == null) {
					throw new GradleException("Sanitized Cloudstream jar is missing ${requiredEntry}")
				}
			}
		} finally {
			verifiedZipFile.close()
		}
	}
}

def cloudstreamRuntimeJar = files(cloudstreamSanitizedJarTask.flatMap { it.archiveFile })

/**
 * T0.3 offline self-built fixture APKs (docs/architecture/tsundoku-extension-integration-plan,
 * Phase 0): pack the compiled `eu.kanade.tachiyomi.*` host ABI into a plain jar so the
 * fixtures/ modules can compile against it with `compileOnly` — no copied ABI sources, so
 * the fixtures can never drift from the host (T2A.1 shipped the novel ABI; the debug variant's
 * classes are exactly the ABI the host exposes via ChildFirstPathClassLoader delegation).
 *
 * R8/minification only runs for release/nightly; the debug `compileDebugKotlin` output is the
 * faithful, unobfuscated ABI.
 */
def exportTachiyomiAbi = tasks.register('exportTachiyomiAbi', Jar) {
	group = 'tsundoku fixtures'
	description = 'Packages compiled eu.kanade.tachiyomi.* host ABI classes into build/libs/tachiyomi-abi.jar for fixture APK modules.'
	archiveBaseName = 'tachiyomi-abi'
	destinationDirectory = layout.buildDirectory.dir('libs')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	preserveFileTimestamps = false
	reproducibleFileOrder = true
	dependsOn 'compileDebugKotlin'
	from(layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes')) {
		include 'eu/kanade/**'
	}
	doLast {
		def jarFile = archiveFile.get().asFile
		def zipFile = new ZipFile(jarFile)
		try {
			[
				'eu/kanade/tachiyomi/source/Source.class',
				'eu/kanade/tachiyomi/source/NovelSource.class',
				'eu/kanade/tachiyomi/source/SourceFactory.class',
				'eu/kanade/tachiyomi/source/SourceTracker.class',
				'eu/kanade/tachiyomi/source/RateLimited.class',
				'eu/kanade/tachiyomi/source/model/RefreshContext.class',
				'eu/kanade/tachiyomi/source/model/Page.class',
			].each { requiredEntry ->
				if (zipFile.getEntry(requiredEntry) == null) {
					throw new GradleException("Exported ABI jar ${jarFile.name} is missing ${requiredEntry}")
				}
			}
		} finally {
			zipFile.close()
		}
	}
}

