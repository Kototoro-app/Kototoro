@CacheableTask
abstract class GenerateAndroidUiStringIdsTask extends DefaultTask {
	@InputFiles
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract ConfigurableFileCollection getUiSources()

	@InputFiles
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract ConfigurableFileCollection getResourceCatalogs()

	@InputFile
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract RegularFileProperty getContentTypesFile()

	@OutputDirectory
	abstract DirectoryProperty getOutputDir()

	static List<String> extractFirstArgs(String text, java.util.regex.Pattern callPattern) {
		def args = []
		def matcher = callPattern.matcher(text)
		while (matcher.find()) {
			int i = matcher.end()
			int start = i
			int depth = 1
			boolean inStr = false
			boolean esc = false
			Integer firstEnd = null
			while (i < text.length() && depth > 0) {
				char ch = text.charAt(i)
				if (inStr) {
					if (esc) esc = false
					else if (ch == (char) '\\') esc = true
					else if (ch == (char) '"') inStr = false
				} else {
					if (ch == (char) '"') inStr = true
					else if (ch == (char) '(') depth++
					else if (ch == (char) ')') {
						depth--
						if (depth == 0 && firstEnd == null) firstEnd = i
					} else if (ch == (char) ',' && depth == 1 && firstEnd == null) {
						firstEnd = i
					}
				}
				i++
			}
			if (firstEnd != null) args << text.substring(start, firstEnd)
		}
		return args
	}

	@TaskAction
	void generate() {
		def declaredStrings = new HashSet<String>()
		def declaredArrays = new HashSet<String>()
		resourceCatalogs.files.findAll { it.isFile() }.each { file ->
			def root = new groovy.xml.XmlParser(false, false).parse(file)
			root.children().each { node ->
				def name = node.attribute('name')
				if (!name) return
				if (node.name() == 'string' || (node.name() == 'item' && node.attribute('type') == 'string')) {
					declaredStrings << name.toString()
				} else if (node.name() in ['string-array', 'array']) {
					declaredArrays << name.toString()
				}
			}
		}
		def strCall = ~/\b(?:uiString|strings\.string|strings\.format)\s*\(/
		def arrCall = ~/\b(?:uiStringArray|strings\.array)\s*\(/
		def keyHelper = ~/(?s)(?:fun\s+\w*(?:LabelKey|TitleKey|StringKey)\s*\([^)]*\)\s*:\s*String\s*=\s*when\s*\([^)]*\)\s*\{([^}]*)\})|(?:enum\s+class\s+\w+\s*\([^)]*\btitleKey\s*:\s*String[^)]*\)\s*\{([^}]*)\})/
		def lit = ~/"([a-z][a-z0-9_]*)"/
		def stringKeys = new TreeSet<String>()
		def arrayKeys = new TreeSet<String>()
		uiSources.files.findAll { it.isFile() }.each { file ->
			def text = file.getText('UTF-8')
			if (!text.contains('core.ui.text')) return
			GenerateAndroidUiStringIdsTask.extractFirstArgs(text, strCall).each { arg ->
				lit.matcher(arg).each { m -> if (m[1] in declaredStrings) stringKeys << m[1].toString() }
			}
			GenerateAndroidUiStringIdsTask.extractFirstArgs(text, arrCall).each { arg ->
				lit.matcher(arg).each { m -> if (m[1] in declaredArrays) arrayKeys << m[1].toString() }
			}
			keyHelper.matcher(text).each { hm ->
				def body = (hm[1] ?: hm[2] ?: '').toString()
				lit.matcher(body).each { m -> if (m[1] in declaredStrings) stringKeys << m[1].toString() }
			}
		}
		boolean inEnum = false
		contentTypesFile.get().asFile.eachLine('UTF-8') { line ->
			if (line.contains('enum class ContentType')) inEnum = true
			else if (inEnum) {
				def entry = line =~ /^\s*([A-Z][A-Z_]+)\s*[,(]/
				if (entry.find()) {
					def key = 'content_type_' + entry.group(1).toLowerCase(Locale.ROOT)
					if (key in declaredStrings) stringKeys << key
				}
			}
		}
		def strBranches = stringKeys.collect { '        "' + it + '" -> R.string.' + it }.join('\n')
		def arrBranches = arrayKeys.collect { '        "' + it + '" -> R.array.' + it }.join('\n')
		def target = outputDir.get().file('org/skepsun/kototoro/core/ui/text/AndroidUiStringIds.kt').asFile
		target.parentFile.mkdirs()
		target.setText("""// Generated by GenerateAndroidUiStringIdsTask. Do not edit.
package org.skepsun.kototoro.core.ui.text

import org.skepsun.kototoro.R

/** Direct resource IDs for shared UI string lookups so R8 resource shrinking retains them. */
internal object AndroidUiStringIds {
    fun stringId(name: String): Int = when (name) {
${strBranches ? strBranches + '\n' : ''}        else -> 0
    }

    fun arrayId(name: String): Int = when (name) {
${arrBranches ? arrBranches + '\n' : ''}        else -> 0
    }
}
""", 'UTF-8')
	}
}
