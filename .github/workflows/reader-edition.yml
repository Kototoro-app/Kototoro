name: Reader Edition

on:
  push:
    branches: [feature/reader-ui-overhaul]
  pull_request:
    branches: [devel]
  workflow_dispatch:
    inputs:
      instrumented:
        description: Run Android emulator tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: reader-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  ai-tooling:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/ai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/ai/package-lock.json
      - name: Install locked OmniRoute development gateway
        run: npm ci --no-audit --no-fund
      - name: Verify OmniRoute CLI
        run: npm run check
      - name: Audit development gateway dependencies
        run: npm audit --audit-level=high
      - name: Start and probe the local gateway without provider credentials
        run: npm run smoke

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android build inputs
        run: sdkmanager 'platforms;android-37.0' 'platforms;android-37.1' 'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Unit and integration tests
        run: ./gradlew :core-domain:jvmTest :reader-core:jvmTest :reader-novel:jvmTest :app:testDebugUnitTest --no-daemon --console=plain --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx6g
      - name: Android Lint and runtime dependency checks
        run: ./gradlew :app:lintDebug :app:verifyReaderDependencies --no-daemon --console=plain --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx6g --no-configuration-cache
      - name: Build installable ARM64 debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx6g
      - name: Verify APK signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*arm64-v8a*.apk)
          test "${#apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "${apks[0]}"
          sha256sum "${apks[0]}" > app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: Kototoro-Reader-debug-arm64
          path: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reader-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-debug.*
            **/build/reports/problems/
          retention-days: 14

  instrumented:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.instrumented)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android build inputs
        run: sdkmanager 'platforms;android-37.0' 'platforms;android-37.1' 'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -PreaderDebugAbi=x86_64 --no-daemon --console=plain --max-workers=2 -Pkotlin.daemon.jvmargs=-Xmx6g
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reader-device-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
