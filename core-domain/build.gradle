// Shared library, progress, history recovery and migration rules. Platform I/O and DI stay in :app.
plugins {
	id 'org.jetbrains.kotlin.multiplatform'
	id 'com.android.kotlin.multiplatform.library'
	id 'org.jetbrains.kotlin.plugin.serialization'
}

kotlin {
	androidLibrary {
		namespace = 'org.skepsun.kototoro.core.domain'
		compileSdk = 37
		minSdk = 26
	}
	jvm {
		compilerOptions {
			jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
		}
	}
	iosArm64()
	iosSimulatorArm64()

	compilerOptions {
		freeCompilerArgs.addAll(
			'-opt-in=kotlin.ExperimentalStdlibApi',
			'-Xannotation-default-target=first-only',
		)
	}

	sourceSets {
		getByName('commonMain') {
			dependencies {
				api project(':core-db')
				api libs.kotlinx.datetime
				api "org.jetbrains.kotlinx:kotlinx-serialization-core:${libs.versions.serialization.get()}"
				// The replace-rule codec moved here from :app so Windows imports and exports the same Legado shape.
				implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${libs.versions.serialization.get()}"
			}
		}
		getByName('jvmTest') {
			dependencies {
				implementation 'org.junit.jupiter:junit-jupiter:5.8.2'
				runtimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
				implementation libs.kotlinx.coroutines.test
				implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${libs.versions.serialization.get()}"
				// In-memory MangaDatabase for the update lifecycle rules that read and write tables.
				implementation 'androidx.sqlite:sqlite-bundled:2.6.2'
				// Only the live community id evaluation searches the real sites; the rules themselves never call core-net.
				implementation project(':core-net')
				implementation libs.ktor.client.java
			}
		}
		// One Jsoup adapter for Android/JVM; common policy and text anchors remain portable.
		getByName('androidMain').kotlin.srcDir('src/jvmSharedMain/kotlin')
		getByName('jvmMain').kotlin.srcDir('src/jvmSharedMain/kotlin')
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// Scores the suggestion rules against a real library: -PsuggestionEvalBackup=/path/to/kototoro.bk.zip
	if (project.hasProperty('suggestionEvalBackup')) {
		systemProperty 'suggestionEvalBackup', project.property('suggestionEvalBackup')
		testLogging.showStandardStreams = true
	}
	// Measures community work key coverage of a real library: -PcommunityEvalBackup=/path/to/kototoro.bk.zip
	if (project.hasProperty('communityEvalBackup')) {
		systemProperty 'communityEvalBackup', project.property('communityEvalBackup')
		testLogging.showStandardStreams = true
	}
	// Searches AniList and Bangumi for a sample of a real library (network): -PcommunityResolveBackup=... [-PcommunityResolveSample=80]
	if (project.hasProperty('communityResolveBackup')) {
		systemProperty 'communityResolveBackup', project.property('communityResolveBackup')
		systemProperty 'communityResolveSample', project.findProperty('communityResolveSample') ?: '80'
		testLogging.showStandardStreams = true
	}
}
