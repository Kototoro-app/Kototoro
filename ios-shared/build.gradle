// iOS composition root. Swift sees a small application API, rather than Room or parser implementation types.
plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Reuse the application's registered OAuth clients without copying credentials into Swift or a second resource file.
def trackingConfigDirectory = layout.buildDirectory.dir('generated/tracking/kotlin')
def generateTrackingConfig = tasks.register('generateTrackingClientConfig') {
    def constants = rootProject.layout.projectDirectory.file('app/src/main/res/values/constants.xml')
    inputs.file(constants)
    outputs.dir(trackingConfigDirectory)
    doLast {
        def document = javax.xml.parsers.DocumentBuilderFactory.newInstance().newDocumentBuilder().parse(constants.asFile)
        def strings = document.getElementsByTagName('string')
        def values = [:]
        for (int i = 0; i < strings.length; i++) {
            def item = strings.item(i)
            values[item.getAttribute('name')] = item.textContent
        }
        def quote = { value -> groovy.json.JsonOutput.toJson(value ?: '').replace('$', '\\$') }
        def entries = [1: 'shikimori', 2: 'anilist', 3: 'mal', 4: 'kitsu', 5: 'bangumi', 7: 'simkl'].collect { id, name ->
            "    ${id} to TrackingClientConfig(${quote(values[name + '_clientId'])}, ${quote(values[name + '_clientSecret'])}),"
        }.join('\n')
        def output = trackingConfigDirectory.get().file('org/skepsun/kototoro/ios/TrackingClients.kt').asFile
        output.parentFile.mkdirs()
        output.text = """package org.skepsun.kototoro.ios
import org.skepsun.kototoro.tracking.discovery.TrackingClientConfig
internal val trackingClients = mapOf(
${entries}
)
"""
    }
}

// Accept an existing simulator UUID so native tests can use the same device as the SwiftUI app.
tasks.withType(org.jetbrains.kotlin.gradle.targets.native.tasks.KotlinNativeSimulatorTest).configureEach {
    def simulator = providers.gradleProperty('iosSimulatorDevice')
    if (simulator.isPresent()) device.set(simulator.get())
}

kotlin {
    def framework = new org.jetbrains.kotlin.gradle.plugin.mpp.apple.XCFrameworkConfig(project, 'KototoroShared')
    [iosArm64(), iosSimulatorArm64()].each { target ->
        target.binaries.framework {
            baseName = 'KototoroShared'
            isStatic = true
            binaryOption('bundleId', 'org.skepsun.kototoro.shared')
            framework.add(it)
        }
    }
    sourceSets {
        iosMain.kotlin.srcDir(trackingConfigDirectory)
        commonMain.dependencies {
            implementation project(':core-db')
            implementation project(':core-domain')
            implementation project(':core-library')
            implementation project(':core-backup')
            implementation project(':core-source')
            implementation project(':core-net')
            implementation project(':reader-core')
            implementation project(':reader-novel')
            implementation project(':source-tvbox')
            implementation project(':core-local')
            // Apple's URL loading system; core-net already pins Ktor and leaves engines to platforms.
            implementation libs.ktor.client.darwin
            // Same pinned driver already used by the shared database's JVM tests.
            implementation 'androidx.sqlite:sqlite-bundled:2.6.2'
            implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${libs.versions.coroutines.get()}"
        }
        commonTest.dependencies {
            implementation kotlin('test')
            implementation libs.ktor.client.mock
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask).configureEach {
    dependsOn(generateTrackingConfig)
}
