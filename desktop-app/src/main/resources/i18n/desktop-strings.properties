# Windows UI text, English base catalog.
#
# `desktop-strings.properties` is the fallback for every language: a translation only lists the keys it translates.
# Placeholders follow java.util.String.format (`%s` text, `%d` integers, `%%` a literal percent sign) and must appear
# in every translation of the key. Screens shared with Android read Android's own catalogs (AndroidStrings), so this
# file stays limited to text the Windows shell owns.
# Keep this file and desktop-strings_<tag>.properties in the same key order; `verifyDesktopStrings` enforces parity.

