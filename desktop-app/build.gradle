// Pinned third-party playback/upscaling artifacts for the Windows distribution (fetched once into the build cache).
def bundledDownloads = [
    libmpv: [repo: 'zhongfly/mpv-winbuild', tag: '2026-10-03-413ff0b1cd',
        asset: 'mpv-dev-lgpl-x86_64-20261003-git-413ff0b1cd.7z',
        sha256: '12a9966bad239672c97276f01a9e625504e0b1d1fdcff95256066eeb8ffb1f21'],
    realcugan: [repo: 'nihui/realcugan-ncnn-vulkan', tag: '20220728', asset: 'realcugan-ncnn-vulkan-20220728-windows.zip',
        sha256: 'c6e08d46c11704b1e3a1ada9ddd591cb5005f52f132136c8633ba25def400e01'],
    realesrgan: [repo: 'xinntao/Real-ESRGAN', tag: 'v0.2.5.0', asset: 'realesrgan-ncnn-vulkan-20220424-windows.zip',
        sha256: 'abc02804e17982a3be33675e4d471e91ea374e65b70167abc09e31acb412802d'],
]
def downloadCache = rootProject.layout.buildDirectory.dir('third-party-downloads').get().asFile
def sha256Of = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input -> byte[] buffer = new byte[65536]; int n; while ((n = input.read(buffer)) != -1) digest.update(buffer, 0, n) }
    digest.digest().encodeHex().toString()
}
/** The pinned asset: a supplied local copy, else the cache, else GitHub (asset API first, then the public link). */
def pinnedArtifact = { String key, File supplied ->
    def spec = bundledDownloads[key]
    if (supplied != null && supplied.isFile()) {
        if (sha256Of(supplied) != spec.sha256) throw new GradleException("${spec.asset}: SHA-256 mismatch")
        return supplied
    }
    def target = new File(downloadCache, spec.asset)
    if (target.isFile() && sha256Of(target) == spec.sha256) return target
    downloadCache.mkdirs()
    def failures = []
    def candidates = []
    try {
        def release = new groovy.json.JsonSlurper().parse(new URL("https://api.github.com/repos/${spec.repo}/releases/tags/${spec.tag}"))
        def asset = release.assets.find { it.name == spec.asset }
        if (asset != null) candidates << [asset.url, 'application/octet-stream']
    } catch (Exception error) { failures << "api: ${error.message}" }
    candidates << ["https://github.com/${spec.repo}/releases/download/${spec.tag}/${spec.asset}", '*/*']
    for (candidate in candidates) {
        try {
            def connection = new URL(candidate[0]).openConnection()
            connection.setRequestProperty('Accept', candidate[1])
            connection.connectTimeout = 20000; connection.readTimeout = 120000
            def partial = new File(downloadCache, spec.asset + '.part')
            connection.inputStream.withStream { input -> partial.withOutputStream { output -> output << input } }
            if (sha256Of(partial) != spec.sha256) { partial.delete(); throw new GradleException('SHA-256 mismatch') }
            java.nio.file.Files.move(partial.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            return target
        } catch (Exception error) { failures << "${candidate[0]}: ${error.message}" }
    }
    throw new GradleException("Cannot fetch ${spec.asset}: ${failures.join('; ')}")
}
def bundledThirdParty = layout.buildDirectory.dir('bundled-third-party')
def prepareBundledThirdParty = tasks.register('prepareBundledThirdParty') {
    outputs.dir(bundledThirdParty)
    inputs.property('pins', bundledDownloads.collect { k, v -> "$k=${v.sha256}" }.join(','))
    doLast {
        def root = bundledThirdParty.get().asFile
        project.delete(root)
        def mpv = new File(root, 'windows/mpv'); mpv.mkdirs()
        def suppliedDll = libmpvDirectory != null ? new File(libmpvDirectory, 'libmpv-2.dll') : null
        if (suppliedDll != null && suppliedDll.isFile()) {
            project.copy { from suppliedDll; into mpv }
        } else {
            def archive = pinnedArtifact('libmpv', null)
            def unpack = new File(temporaryDir, 'mpv'); project.delete(unpack); unpack.mkdirs()
            // Prefer 7-Zip (preinstalled on GitHub's Windows images), then Windows' bsdtar by path. Older bsdtar
            // builds (windows-2022) lack LZMA, and Git's GNU tar, first on CI PATH, reads neither 7z nor "D:\" paths.
            def systemRoot = System.getenv('SystemRoot')
            def extractors = [
                [new File(System.getenv('ProgramFiles') ?: 'C:/Program Files', '7-Zip/7z.exe'),
                    ['x', '-y', "-o${unpack.absolutePath}", archive.absolutePath, 'libmpv-2.dll']],
                [systemRoot != null ? new File(systemRoot, 'System32/tar.exe') : null,
                    ['-xf', archive.absolutePath, '-C', unpack.absolutePath, 'libmpv-2.dll']],
            ].findAll { it[0]?.isFile() }
            def failures = []
            for (extractor in extractors) {
                def command = ([extractor[0].absolutePath] + extractor[1]).collect { it.toString() }
                def process = new ProcessBuilder(command).redirectErrorStream(true).start()
                def output = process.inputStream.text
                if (process.waitFor() == 0 && new File(unpack, 'libmpv-2.dll').isFile()) break
                failures << "${extractor[0].name}: ${output.trim()}"
            }
            if (!new File(unpack, 'libmpv-2.dll').isFile()) {
                throw new GradleException("Cannot extract libmpv-2.dll (${failures.join('; ') ?: 'no 7z or bsdtar found'})")
            }
            project.copy { from new File(unpack, 'libmpv-2.dll'); into mpv }
        }
        ['realcugan', 'realesrgan'].each { key ->
            def supplied = ncnnDirectory != null ? new File(ncnnDirectory, bundledDownloads[key].asset) : null
            def archive = pinnedArtifact(key, supplied)
            def target = new File(root, "windows/upscale/$key")
            project.copy {
                from(project.zipTree(archive)) {
                    exclude '**/*.mp4', '**/*.jpg', '**/*.png', '**/*.webp', '**/vcomp140d.dll'
                    // Strip the archive's top folder when it has one.
                    eachFile { details ->
                        def segments = details.relativePath.segments
                        if (segments.length > 1 && segments[0].endsWith('-windows')) {
                            details.relativePath = new RelativePath(!details.directory, segments.drop(1) as String[])
                        }
                    }
                    includeEmptyDirs = false
                }
                into target
            }
        }
        def notices = new File(root, 'common/THIRD_PARTY_PLAYBACK.md'); notices.parentFile.mkdirs()
        notices.setText("""# Bundled playback and upscaling components

| Component | Version | Licence | Source |
|---|---|---|---|
| libmpv (LGPL build, with FFmpeg, libplacebo) | ${bundledDownloads.libmpv.tag} | LGPL-2.1-or-later | https://github.com/mpv-player/mpv, build: https://github.com/${bundledDownloads.libmpv.repo} |
| realcugan-ncnn-vulkan (ncnn, Real-CUGAN models) | ${bundledDownloads.realcugan.tag} | MIT (program), BSD-3-Clause (ncnn) | https://github.com/${bundledDownloads.realcugan.repo} |
| realesrgan-ncnn-vulkan (ncnn, Real-ESRGAN models) | ${bundledDownloads.realesrgan.tag} | BSD-3-Clause | https://github.com/${bundledDownloads.realesrgan.repo} |
| Anime4K GLSL shaders | as in the Android app | MIT | https://github.com/bloc97/Anime4K |
| AMD FidelityFX FSR 1.0 for mpv | 1.0.2 | MIT | https://gist.github.com/agyild/82219c545228d70c5604f865ce0b0ce5 |

libmpv is dynamically loaded from resources/mpv and may be replaced with another compatible build.
""", 'UTF-8')
    }
}
