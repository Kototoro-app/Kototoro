    dependsOn ':mihon-desktop-compat:animeFixtureJar'
}

tasks.named('test') { exclude '**/DesktopDistributionTest.class' }
if (bundleWindowsRuntime) {
    tasks.withType(org.jetbrains.compose.desktop.application.tasks.AbstractJPackageTask).matching {
        it.name == 'packageMsi'
    }.configureEach {
        // Package the tested image directly: separate Skiko preprocessing creates different JAR names/bytes.
        appImage.set(layout.buildDirectory.dir('compose/binaries/main/app/Kototoro'))
        dependsOn 'windowsDistributionTest'
    }
    tasks.register('windowsMsiContentsCheck', Exec) {
        dependsOn 'packageMsi', 'createDistributable'
        inputs.file('inspect-windows-msi.ps1')
        inputs.file(layout.buildDirectory.file("compose/binaries/main/msi/Kototoro-${windowsPackageVersion}.msi"))
        inputs.dir(layout.buildDirectory.dir('compose/binaries/main/app/Kototoro'))
        commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('inspect-windows-msi.ps1').absolutePath,
            '-MsiPath', layout.buildDirectory.file("compose/binaries/main/msi/Kototoro-${windowsPackageVersion}.msi").get().asFile.absolutePath,
            '-ImageDirectory', layout.buildDirectory.dir('compose/binaries/main/app/Kototoro').get().asFile.absolutePath,
            '-WixDirectory', windowsWixDirectory,
            '-OutputDirectory', layout.buildDirectory.dir('reports/windows-msi').get().asFile.absolutePath
    }
    tasks.register('windowsPortableZip', Zip) {
        dependsOn 'windowsDistributionTest'
        from(layout.buildDirectory.dir('compose/binaries/main/app/Kototoro')) { into 'Kototoro' }
        destinationDirectory = layout.buildDirectory.dir('compose/binaries/main/portable')
        archiveFileName = "Kototoro-Windows-local-preview-${windowsPackageVersion}.zip"
    }
    tasks.register('windowsDistributionTest', Test) {
        def distributionTempDirectory = layout.buildDirectory.dir('tmp/windowsDistributionTest').get().asFile
        systemProperty 'java.io.tmpdir', distributionTempDirectory.absolutePath
        doFirst { distributionTempDirectory.mkdirs() }
        dependsOn tasks.named('createDistributable'), tasks.named('testClasses')
        inputs.dir(layout.buildDirectory.dir('compose/binaries/main/app/Kototoro'))
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        include '**/DesktopDistributionTest.class'
        systemProperty 'kototoro.desktop.distribution', layout.buildDirectory.dir('compose/binaries/main/app/Kototoro').get().asFile
        systemProperty 'kototoro.desktop.probe.classes', sourceSets.test.output.classesDirs.asPath
    }
}
