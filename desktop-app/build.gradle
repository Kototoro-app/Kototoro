// The pinned compatibility runtime already supplies these libraries at the exact versions its extensions were validated
// with (OkHttp 5.4.0, Okio, Jsoup 1.23, an org.json port). The parser host brings its own copies for standalone use;
// keeping both would let the older ones shadow the pinned jars, so the app's runtime classpaths leave them out.
configurations.configureEach { configuration ->
    if (configuration.name in ['runtimeClasspath', 'testRuntimeClasspath']) {
        configuration.exclude group: 'com.squareup.okhttp3'
        configuration.exclude group: 'com.squareup.okio'
        configuration.exclude group: 'org.jsoup'
        configuration.exclude group: 'org.json', module: 'json'
    }
}

