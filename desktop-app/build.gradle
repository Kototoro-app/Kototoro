def runtimeJarDirectory = layout.buildDirectory.dir("windows-runtime/${runtimeLockHash}")
def prepareWindowsRuntimeJars = tasks.register('prepareWindowsRuntimeJars', Copy) {
    dependsOn ':mihon-desktop-compat:verifyWindowsRuntime'
    inputs.file(runtimePins)
    compatibilityFiles.files.eachWithIndex { artifact, index ->
        from(artifact) { rename { String.format('%03d-%s', index, artifact.name) } }
    }
    into runtimeJarDirectory
}
def packagedRuntimeArtifacts = files(tasks.named('jar'), configurations.runtimeClasspath,
    runtimeJarDirectory.map { fileTree(it) { include '*.jar' } }).builtBy(prepareWindowsRuntimeJars)

def prepareWindowsResources = tasks.register('prepareWindowsResources', Copy) {
    dependsOn ':mihon-desktop-compat:verifyWindowsRuntime', ':mihon-desktop-compat:compileWebViewBridge', tasks.named('jar')
    inputs.files(runtimeArtifacts)
    inputs.file(runtimePins)
    from(bridgeDirectory) { include bridgeNames; into 'windows/browser' }
    from('distribution/LOCAL_PREVIEW.md') { into 'common' }
    from(rootProject.file('LICENSE')) { rename { 'PROJECT_LICENSE' }; into 'common' }
    from(runtimePins) { into 'common' }
    dependsOn prepareBundledThirdParty
    from(bundledThirdParty)
    into windowsResources
    doFirst {
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            throw new GradleException('Windows distribution requires a Windows build host')
        }
        bridgeNames.each { name ->
            if (!new File(bridgeDirectory.get().asFile, name).isFile()) {
                throw new GradleException("Missing packaged browser artifact: ${name}")
            }
        }
    }
    doLast {
        def artifacts = runtimeArtifacts.files + bridgeNames.collect { new File(bridgeDirectory.get().asFile, it) }
        def lines = ['name\tbytes\tsha256'] + artifacts.sort { it.name }.collect { artifact ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            "${artifact.name}\t${artifact.length()}\t${digest.digest().encodeHex()}"
        }
        new File(windowsResources.get().asFile, 'common/runtime-artifacts.tsv').setText(lines.join('\n') + '\n', 'UTF-8')
    }
}

compose.desktop {
    application {
        mainClass = 'org.skepsun.kototoro.desktop.app.DesktopMainKt'
        javaHome = desktopLauncher.get().metadata.installationPath.asFile.absolutePath
        if (bundleWindowsRuntime) {
            disableDefaultConfiguration()
            mainJar.set(tasks.named('jar').flatMap { it.archiveFile })
            fromFiles(packagedRuntimeArtifacts)
            dependsOn(prepareWindowsResources.get())
        }
        nativeDistributions {
            packageName = 'Kototoro'
            packageVersion = windowsPackageVersion
            description = 'Kototoro Windows local preview'
            vendor = 'Kototoro'
            includeAllModules = true
            targetFormats(org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi)
            if (bundleWindowsRuntime) appResourcesRootDir.set(windowsResources)
            windows {
                perUserInstall = true
                // A sibling directory avoids merging program uninstall rules with the user data directory.
                installationPath = 'Kototoro-App'
                dirChooser = false
                menu = true
                menuGroup = 'Kototoro'
                shortcut = true
                upgradeUuid = '78f89549-27ec-4c2c-8b87-297c43349a44'
            }
        }
    }
}

tasks.withType(org.jetbrains.compose.desktop.application.tasks.AbstractJPackageTask).configureEach {
    if (bundleWindowsRuntime) dependsOn prepareWindowsResources
    doFirst {
        if (!bundleWindowsRuntime) throw new GradleException('Supply -PwithWindowsDistribution to bundle the verified Windows runtime')
    }
}

tasks.withType(org.jetbrains.compose.desktop.application.tasks.AbstractJLinkTask).configureEach { link ->
    // Compose 1.12.0 defaults to stripping commands. Keep the bundled JVM usable for local support/probes.
    if (bundleWindowsRuntime) link.'getStripNativeCommands$compose'().set(false)
}

tasks.matching { it.name == 'prepareAppResources' }.configureEach {
    if (bundleWindowsRuntime) dependsOn prepareWindowsResources
}

def bridgePath = providers.gradleProperty('desktopBridgeExecutable').getOrNull()
def desktopDataDirectory = providers.gradleProperty('desktopDataDirectory').getOrNull()
def desktopImportJar = providers.gradleProperty('desktopImportJar').getOrNull()
def developerClasspath = sourceSets.main.runtimeClasspath + compatibilityFiles
def desktopArguments = []
if (desktopDataDirectory != null) desktopArguments.addAll(['--data-dir', desktopDataDirectory])
if (desktopImportJar != null) desktopArguments.addAll(['--import', desktopImportJar])
tasks.withType(JavaExec).configureEach {
    if (name == 'run') {
        dependsOn ':mihon-desktop-compat:verifyMihonCompatibility'
        // Compose sets run classpath/args late. Apply developer-only inputs after that configuration.
        doFirst { launch ->
            launch.classpath = developerClasspath
            if (bridgePath != null) launch.systemProperty 'kototoro.compat.bridge.exe', bridgePath
            if (libmpvDirectory != null) launch.systemProperty 'kototoro.libmpv.dir', libmpvDirectory
            if (!desktopArguments.isEmpty()) launch.setArgs(desktopArguments)
        }
    }
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    javaLauncher = desktopLauncher
    // The UI tests assert the text the app ships in Chinese, so the language is pinned instead of following the
    // machine's locale (`--lang`/DesktopStrings.pin); without this, the same tests fail on an English CI machine.
    systemProperty 'kototoro.desktop.locale', 'zh-CN'
    systemProperty 'kototoro.desktop.test.classpath', (sourceSets.test.runtimeClasspath + compatibilityFiles).asPath
    systemProperty 'kototoro.desktop.fixture.jar', project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/offline-desktop-fixture.jar').get().asFile
    systemProperty 'kototoro.desktop.challenge.fixture.jar', project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/interactive-desktop-fixture.jar').get().asFile
    systemProperty 'kototoro.desktop.reader.fixture.jar', project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/reader-desktop-fixture.jar').get().asFile
    systemProperty 'kototoro.desktop.cover.fixture.jar', project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/cover-desktop-fixture.jar').get().asFile
    systemProperty 'kototoro.desktop.filter.fixture.jar', project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/filter-desktop-fixture.jar').get().asFile
    systemProperty 'kototoro.desktop.bridge.exe', project(':mihon-desktop-compat').layout.buildDirectory.file('bridge/kototoro-webview-bridge.exe').get().asFile
    // kototoro / kotatsu / Tsuki plugin fixtures: real bytecode built by :parser-host against the shared ABI.
    systemProperty 'kototoro.desktop.anime.fixture.jar', project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/anime-desktop-fixture.jar').get().asFile
    systemProperty 'kototoro.desktop.parser.fixtures', project(':parser-host').layout.buildDirectory.dir('fixtures').get().asFile
    // Built by d8 when an Android SDK is configured; the Cloudstream UI test is skipped otherwise.
    dependsOn ':cloudstream-desktop:fixtureCs3'
    systemProperty 'kototoro.desktop.cloudstream.fixture', project(':cloudstream-desktop').layout.buildDirectory.file('fixtures/FixtureRepo.cs3').get().asFile
    // Opt-in: real extension APKs (novelfull.apk, ...) for the live smoke tests.
    providers.gradleProperty('realApkDirectory').orNull?.with { systemProperty 'kototoro.dex.real.apks', it }
    providers.gradleProperty('realNovelApk').orNull?.with { systemProperty 'kototoro.real.novel', it }
    providers.gradleProperty('realAnimeApk').orNull?.with { systemProperty 'kototoro.real.anime', it }
    providers.gradleProperty('realDirect').orNull?.with { systemProperty 'kototoro.real.direct', it }
    providers.gradleProperty('mpvOptions').orNull?.with { systemProperty 'kototoro.real.mpvoptions', it }
    providers.gradleProperty('ncnnDirectory').orNull?.with { systemProperty 'kototoro.ncnn.dir', it }
    if (libmpvDirectory != null) systemProperty 'kototoro.libmpv.dir', libmpvDirectory
    dependsOn ':parser-host:fixtureKototoroJar', ':parser-host:fixtureKotatsuJar', ':parser-host:fixtureTsukiJar'
    inputs.file(project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/offline-desktop-fixture.jar'))
    inputs.file(project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/interactive-desktop-fixture.jar'))
    inputs.file(project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/reader-desktop-fixture.jar'))
    inputs.file(project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/cover-desktop-fixture.jar'))
    inputs.file(project(':mihon-desktop-compat').layout.buildDirectory.file('fixtures/filter-desktop-fixture.jar'))
    inputs.files(project(':mihon-desktop-compat').layout.buildDirectory.file('bridge/kototoro-webview-bridge.exe'))
    // Bridge is optional for app tests, but never read it while a combined compat run is rebuilding it.
    mustRunAfter ':mihon-desktop-compat:compileWebViewBridge'
    dependsOn ':mihon-desktop-compat:offlineFixtureJar', ':mihon-desktop-compat:verifyMihonCompatibility'
    dependsOn ':mihon-desktop-compat:challengeFixtureJar'
    dependsOn ':mihon-desktop-compat:readerFixtureJar'
    dependsOn ':mihon-desktop-compat:coverFixtureJar'
    dependsOn ':mihon-desktop-compat:filterFixtureJar'
    dependsOn ':mihon-desktop-compat:animeFixtureJar'
}

tasks.named('test') { exclude '**/DesktopDistributionTest.class' }
if (bundleWindowsRuntime) {
    // The jpackage launcher resolves its runtime, and the bundled ncnn tools open their images, through ANSI APIs.
    // Give every shipped executable the UTF-8 code page so paths outside the system code page (install directory,
    // data directory, TEMP) still work. Every package (tested image, ZIP, MSI) is built from this image.
    def utf8LauncherScript = file('windows-utf8-launcher.ps1')
    def windowsImage = layout.buildDirectory.dir('compose/binaries/main/app/Kototoro').get().asFile
    tasks.matching { it.name == 'createDistributable' }.configureEach {
        inputs.file(utf8LauncherScript)
        doLast {
            // The bundled java/javaw commands (kept for support and probes) locate the runtime the same way.
            def executables = ['Kototoro.exe', 'runtime/bin/java.exe', 'runtime/bin/javaw.exe'].collect { new File(windowsImage, it) }
            def upscale = new File(windowsImage, 'app/resources/upscale')
            if (upscale.isDirectory()) {
                upscale.eachFileRecurse(groovy.io.FileType.FILES) { if (it.name.endsWith('.exe')) executables << it }
            }
            if (executables.size() != 5 || !executables.every { it.isFile() }) {
                throw new GradleException("Expected the launcher, java/javaw and two ncnn tools, found ${executables*.name}")
            }
            executables.each { executable ->
                def process = new ProcessBuilder('powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                    '-File', utf8LauncherScript.absolutePath, '-LauncherPath', executable.absolutePath)
                    .redirectErrorStream(true).start()
                def output = process.inputStream.text
                if (process.waitFor() != 0) throw new GradleException("Cannot set the UTF-8 code page of ${executable.name}: ${output.trim()}")
                logger.lifecycle(output.trim())
            }
        }
    }
    tasks.withType(org.jetbrains.compose.desktop.application.tasks.AbstractJPackageTask).matching {
        it.name == 'packageMsi'
    }.configureEach {
        // Package the tested image directly: separate Skiko preprocessing creates different JAR names/bytes.
        appImage.set(layout.buildDirectory.dir('compose/binaries/main/app/Kototoro'))
        dependsOn 'windowsDistributionTest'
    }
    tasks.register('windowsMsiContentsCheck', Exec) {
        dependsOn 'packageMsi', 'createDistributable'
        inputs.file('inspect-windows-msi.ps1')
        inputs.file(layout.buildDirectory.file("compose/binaries/main/msi/Kototoro-${windowsPackageVersion}.msi"))
        inputs.dir(layout.buildDirectory.dir('compose/binaries/main/app/Kototoro'))
        commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('inspect-windows-msi.ps1').absolutePath,
            '-MsiPath', layout.buildDirectory.file("compose/binaries/main/msi/Kototoro-${windowsPackageVersion}.msi").get().asFile.absolutePath,
            '-ImageDirectory', layout.buildDirectory.dir('compose/binaries/main/app/Kototoro').get().asFile.absolutePath,
            '-WixDirectory', windowsWixDirectory,
            '-OutputDirectory', layout.buildDirectory.dir('reports/windows-msi').get().asFile.absolutePath
    }
    tasks.register('windowsPortableZip', Zip) {
        dependsOn 'windowsDistributionTest'
        from(layout.buildDirectory.dir('compose/binaries/main/app/Kototoro')) { into 'Kototoro' }
        destinationDirectory = layout.buildDirectory.dir('compose/binaries/main/portable')
        archiveFileName = "Kototoro-Windows-local-preview-${windowsPackageVersion}.zip"
    }
    tasks.register('windowsDistributionTest', Test) {
        def distributionTempDirectory = layout.buildDirectory.dir('tmp/windowsDistributionTest').get().asFile
        systemProperty 'java.io.tmpdir', distributionTempDirectory.absolutePath
        doFirst { distributionTempDirectory.mkdirs() }
        dependsOn tasks.named('createDistributable'), tasks.named('testClasses')
        inputs.dir(layout.buildDirectory.dir('compose/binaries/main/app/Kototoro'))
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        include '**/DesktopDistributionTest.class'
        systemProperty 'kototoro.desktop.distribution', layout.buildDirectory.dir('compose/binaries/main/app/Kototoro').get().asFile
        systemProperty 'kototoro.desktop.probe.classes', sourceSets.test.output.classesDirs.asPath
    }
}
