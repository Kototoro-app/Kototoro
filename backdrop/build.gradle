// Vendored Backdrop 2.0.0 with its original Android and Skiko implementations.
plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'com.android.kotlin.multiplatform.library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose' version '1.12.0'
}
kotlin {
    androidLibrary {
        namespace = 'com.kyant.backdrop'
        compileSdk = 37
        minSdk = 26
    }
    jvm {
        compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11 }
    }
    sourceSets {
        commonMain {
            // Retain patched common sources in place, restoring only the platform declarations.
            kotlin.srcDir('src/main/kotlin')
            dependencies {
                api compose.foundation
                api compose.ui
                api libs.kyant.shapes
                implementation 'org.jetbrains:annotations:26.1.0'
            }
        }
        androidMain.dependencies { implementation 'androidx.annotation:annotation:1.9.1' }
        skikoMain { dependsOn commonMain }
        jvmMain { dependsOn skikoMain }
    }
}
