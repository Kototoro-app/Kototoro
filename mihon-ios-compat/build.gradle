// Opt-in iOS JVM platform. Third-party APIs are supplied locally and never enter the default distribution.
plugins {
    id 'org.jetbrains.kotlin.jvm'
}

kotlin {
    jvmToolchain(24)
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11 }
}
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

def compatibility = providers.gradleProperty('mihonIosCompatibilityDirectory')
if (!compatibility.isPresent()) throw new GradleException('Set -PmihonIosCompatibilityDirectory to the pinned iOS API directory')
def directory = file(compatibility.get())
def pins = new Properties()
file('compatibility-pins.properties').withInputStream { pins.load(it) }
pins.each { name, expected ->
    def artifact = new File(directory, name)
    if (!artifact.isFile()) throw new GradleException("Missing iOS API: ${artifact}")
    def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
    if (actual != expected) throw new GradleException("iOS API SHA-256 mismatch: ${name}")
}
def apis = fileTree(directory) {
    include '*.jar'
    exclude '000-*', 'kotlin-stdlib*', 'kotlinx-coroutines*', 'kotlinx-serialization-core*', 'kotlinx-serialization-json*'
}
// The Aniyomi animesource ABI is not part of the Mobile API. Compile the same sources the Windows adapter ports
// (they only use OkHttp/Rx/Injekt/jsoup types both APIs provide) instead of keeping a second copy.
sourceSets.main.kotlin.srcDir(rootProject.file('mihon-desktop-compat/src/main/kotlin/eu'))

dependencies {
    implementation project(':source-host')
    implementation project(':mihon-ios-shims')
    implementation project(':core-source')
    // kototoro / kotatsu / UMA parser JARs share the Mobile API's OkHttp client and cookie store.
    implementation project(':parser-host')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${libs.versions.coroutines.get()}"
    implementation libs.kotlinx.serialization.json
    compileOnly apis
    testImplementation apis
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

// The adapter calls host constructors directly: rebuild the entire project-owned runtime as one ABI unit.
// Third-party artifacts retain the versions and ordering selected by the staged profile.
def iosHostProjects = configurations.runtimeClasspath.incoming.artifactView {
    componentFilter { it instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier }
}.files
tasks.register('stageIosHost', Sync) {
    from(tasks.named('jar'))
    from(iosHostProjects)
    rename { name ->
        switch (name) {
            case 'mihon-ios-compat.jar': return '05-mihon-ios-compat.jar'
            case 'mihon-ios-shims.jar': return '00-kototoro-ios-shims.jar'
            default: return "10-${name}"
        }
    }
    into layout.buildDirectory.dir('ios-host')
}

tasks.register('stagePreview', Sync) {
    dependsOn tasks.named('jar')
    def target = rootProject.layout.projectDirectory.dir('iosApp/build/jvm/ios-adapter')
    from(tasks.named('jar'))
    // Runtime dependencies (source-host, parser-host, parser-api, ...); the staging script drops any artifact the
    // Mobile API already provides so one copy of OkHttp/okio/jsoup serves every ecosystem.
    from(configurations.runtimeClasspath) { into 'deps' }
    into target
}
