pluginManagement {
	buildscript {
		repositories {
			google()
			mavenCentral()
			maven { url = uri("https://storage.googleapis.com/r8-releases/raw") }
		}
		// R8 override removed with AGP 9.3.1: its bundled R8 (9.3.16) is newer than the
		// previously pinned 9.1.31 (kept for Kotlin 2.4 metadata compatibility, now satisfied
		// by AGP's own toolchain).
		dependencies {
		}
	}
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github\\..*")
				excludeGroup("com.github.bytedance")
			}
		}
		maven {
			url 'https://artifact.bytedance.com/repository/releases/'
			content {
				includeGroup("com.github.bytedance")
			}
		}
	}
}

include ':app', ':parser-api', ':backdrop'
// T0.3 offline self-built NovelSourcery/Tsundoku fixture APKs (plan Phase 0 / T0.3). Each
// module compiles against :app:exportTachiyomiAbi (host ABI jar) with compileOnly and packs
// the real manifest morphologies the host's strict classifier/loader must accept or reject.
//
// These are dev-only application modules; they are gated behind `-PwithTsundokuFixtures`
// (default OFF) so Android Studio's multi-module deployment and `installDebug` do not keep
// reinstalling the fixture packages onto connected devices.
def withTsundokuFixtures = providers.gradleProperty('withTsundokuFixtures').map { it != 'false' }.getOrElse(false)
if (withTsundokuFixtures) {
    include ':fixtures:tsundoku-14-single'
    include ':fixtures:tsundoku-14-factory'
    include ':fixtures:tsundoku-16-suspend'
    include ':fixtures:tsundoku-ambiguous'
}
rootProject.name = "Kototoro"

