// JVM platform services for the Windows desktop application; shared schema and source execution are reused.
plugins {
	id 'org.jetbrains.kotlin.jvm'
	id 'org.jetbrains.kotlin.plugin.serialization'
	id 'java-library'
	id 'application'
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
	api project(':core-db')
	api project(':core-domain')
	api project(':core-library')
	api project(':core-source')
	api project(':core-backup')
	api project(':core-net')
	api project(':source-host')
	api project(':parser-host')
	api project(':dex-convert')
	// Same bundled driver/version already validated by core-db's JVM tests, now used by the desktop runtime.
	implementation 'androidx.sqlite:sqlite-bundled:2.6.2'
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${libs.versions.coroutines.get()}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
}

application {
	mainClass = 'org.skepsun.kototoro.desktop.runtime.DesktopCliKt'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// The test compares the desktop file with Android's exported schema of the current DATABASE_VERSION.
	def schemaDir = rootProject.file('app/schemas/org.skepsun.kototoro.core.db.MangaDatabase')
	systemProperty 'kototoro.schemaDir', schemaDir.absolutePath
	providers.gradleProperty('ncnnDirectory').orNull?.with { systemProperty 'kototoro.ncnn.dir', it }
	// Opt-in: a directory holding real extension APKs (novelfull.apk), as for :dex-convert.
	providers.gradleProperty('realApkDirectory').orNull?.with { systemProperty 'kototoro.dex.real.apks', it }
}

tasks.named('test') {
	dependsOn tasks.named('installDist')
	def distribution = layout.buildDirectory.dir('install/desktop-runtime').get().asFile
	systemProperty 'kototoro.desktopDistribution', distribution.absolutePath
}

// Android seeds the dictionary-rule table from `assets/defaultData/dictRules.json` on first read. The Windows runtime
// ships the same file as a resource (and the application gets it through this module), so both hosts start with the
// rules the release carries instead of a second copy of the JSON that would drift.
def desktopDictionaryDefaults = layout.buildDirectory.dir('generated/dictionary-rules')
def prepareDesktopDictionaryRules = tasks.register('prepareDesktopDictionaryRules') {
	def source = rootProject.file('app/src/main/assets/defaultData/dictRules.json')
	inputs.file(source)
	outputs.dir(desktopDictionaryDefaults)
	doLast {
		def target = desktopDictionaryDefaults.get().file('defaultData/dictRules.json').asFile
		target.parentFile.mkdirs()
		target.bytes = source.bytes
	}
}
sourceSets.main.resources.srcDir(desktopDictionaryDefaults)
tasks.named('processResources').configure { dependsOn prepareDesktopDictionaryRules }
