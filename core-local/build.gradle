// Local works (docs/architecture/ios-data-portability-plan-2026-10.md §1): CBZ/ZIP manga (including the archives
// Kototoro writes with index.json), EPUB and TXT novels, and single video files served as a shared SourceRuntime
// ("LOCAL" / "LOCAL_NOVEL" / "LOCAL_VIDEO", Android's local source names). Pure Kotlin; the platform passes storage
// directories and the legacy text decoder, and checks video codec/container support before importing.
plugins {
	id 'org.jetbrains.kotlin.multiplatform'
	id 'com.android.kotlin.multiplatform.library'
	id 'org.jetbrains.kotlin.plugin.serialization'
}

kotlin {
	// Android reads the shared formats (ComicInfo.xml) from :app; its I/O stays in the app's own parser.
	androidLibrary {
		namespace = 'org.skepsun.kototoro.local.shared'
		compileSdk = 37
		minSdk = 26
	}
	jvm {
		compilerOptions {
			jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
		}
	}
	iosArm64()
	iosSimulatorArm64()

	sourceSets {
		getByName('commonMain') {
			dependencies {
				api project(':core-source')
				api libs.okio
				implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${libs.versions.serialization.get()}"
				implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${libs.versions.coroutines.get()}"
			}
		}
		// Android and the JVM share the one platform file (the system file system).
		getByName('androidMain').kotlin.srcDir('src/jvmMain/kotlin')
		getByName('jvmTest') {
			dependencies {
				implementation 'org.junit.jupiter:junit-jupiter:5.8.2'
				runtimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
				implementation libs.kotlinx.coroutines.test
			}
		}
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}
