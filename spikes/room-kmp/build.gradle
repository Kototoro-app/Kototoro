// SPIKE S2 (docs/architecture/kmp-ios-plan-2026-10.md §5 P0): can the real Room schema live in a
// KMP module? This module holds a COPY of MangaDatabase + all entities/DAOs; the edits needed to
// make it compile are listed in the plan doc §10 ("切断清单"). Nothing here is consumed by :app.
// Gated by -PwithKmpSpikes.
plugins {
	id 'org.jetbrains.kotlin.multiplatform'
	id 'com.android.kotlin.multiplatform.library'
	id 'org.jetbrains.kotlin.plugin.serialization'
	id 'com.google.devtools.ksp'
	id 'androidx.room'
}

kotlin {
	androidLibrary {
		namespace = 'org.skepsun.kototoro.spikes.roomkmp'
		compileSdk = 37
		minSdk = 26

		// Needed so the device-test APK can carry the schema JSON files as assets.
		androidResources {
			enable = true
		}

		// Instrumented tests (MigrationTestHelper against the real 1..84 schema history).
		withDeviceTestBuilder {
			sourceSetTreeName = 'test'
		}.configure {
			instrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
		}
	}

	jvm {
		compilerOptions {
			jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
		}
	}
	iosArm64()
	iosSimulatorArm64()

	compilerOptions {
		freeCompilerArgs.addAll(
			'-opt-in=kotlin.ExperimentalStdlibApi',
			'-opt-in=kotlin.contracts.ExperimentalContracts',
			'-Xannotation-default-target=first-only',
		)
	}

	sourceSets {
		getByName('commonMain') {
			dependencies {
				api libs.androidx.room.runtime
				api "org.jetbrains.kotlinx:kotlinx-coroutines-core:${libs.versions.coroutines.get()}"
				implementation "org.jetbrains.kotlinx:kotlinx-serialization-core:${libs.versions.serialization.get()}"
				implementation 'androidx.sqlite:sqlite-bundled:2.6.2'
			}
		}
		getByName('androidMain') {
			dependencies {
				// Migration16To17 reads the legacy SharedPreferences through PreferenceManager.
				implementation libs.androidx.preference
			}
		}
		getByName('jvmTest') {
			dependencies {
				implementation 'org.junit.jupiter:junit-jupiter:5.8.2'
				implementation libs.kotest.runner.junit5
			}
		}
		getByName('androidDeviceTest') {
			dependencies {
				implementation libs.androidx.runner
				implementation libs.androidx.rules
				implementation libs.androidx.junit
				implementation libs.androidx.room.testing
			}
		}
	}
}

// KSP: Room generates per target. The metadata (commonMain) configuration must NOT get the compiler.
dependencies {
	add('kspAndroid', libs.androidx.room.compiler)
	add('kspJvm', libs.androidx.room.compiler)
	add('kspIosArm64', libs.androidx.room.compiler)
	add('kspIosSimulatorArm64', libs.androidx.room.compiler)
}

room {
	schemaDirectory("$projectDir/schemas")
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}
